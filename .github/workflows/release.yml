name: Auto Release & Changelog Generator

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  # -------------------------------------------------------------
  # Automated Semantic Versioning & GitHub Release
  # -------------------------------------------------------------
  release:
    name: 🚀 Build Release & Generate Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for Frontend Bundle
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Build Frontend Distribution
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          tar -czf vface-frontend-dist.tar.gz -C frontend/dist .

      - name: Determine Version and Tag
        id: versioning
        run: |
          # Check if triggered by tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Calculate next patch version based on latest git tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            echo "Latest tag: $LATEST_TAG"
            
            # Simple semver bump
            BASE_VER="${LATEST_TAG#v}"
            IFS='.' read -r -a PARTS <<< "$BASE_VER"
            MAJOR="${PARTS[0]:-1}"
            MINOR="${PARTS[1]:-0}"
            PATCH="${PARTS[2]:-0}"
            
            RELEASE_TYPE="${{ github.event.inputs.release_type || 'patch' }}"
            if [ "$RELEASE_TYPE" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$RELEASE_TYPE" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "NEW_TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate Changelog & Release Notes
        id: changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.NEW_TAG }}
          name: "V-Face Ecosystem Release ${{ steps.versioning.outputs.VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            vface-frontend-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
