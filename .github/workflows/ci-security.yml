name: CI & Security Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Security Audit & Secret Leak Detection
  # -------------------------------------------------------------
  security-audit:
    name: 🛡️ Security Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit & Pip-Audit
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Python SAST Security Scan (Bandit)
        run: |
          echo "Scanning Python backend codebase for vulnerabilities..."
          bandit -r app services/core-user/app -ll -ii || true

      - name: Python Dependency Vulnerability Audit (Pip-Audit)
        run: |
          echo "Scanning backend dependencies..."
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          fi
          if [ -f services/core-user/requirements.txt ]; then
            pip-audit -r services/core-user/requirements.txt || true
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Node.js NPM Security Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

  # -------------------------------------------------------------
  # JOB 2: Build & Lint Validation
  # -------------------------------------------------------------
  build-and-test:
    name: 🧪 Build & Lint Validation
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Code Syntax
        run: |
          python -m py_compile $(git ls-files '*.py')
