name: v_face_mobile
description: "V-Face Mobile Employee Self-Service Application for Android & iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage & Security
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.2

  # Device Features (Camera, GPS, Wi-Fi)
  camera: ^0.12.0+2
  geolocator: ^14.0.3
  network_info_plus: ^8.2.1
  permission_handler: ^13.0.1
  local_auth: ^3.0.2

  # UI Components & Icons
  intl: ^0.20.3
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^1.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
